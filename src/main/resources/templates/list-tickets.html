<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>List Tickets</title>
    <link th:href="@{/styles/table.css}" rel="stylesheet" />
    <link th:href="@{/styles/util.css}" rel="stylesheet" />
</head>
    <body>
    <a th:href="@{/logout}">Logout</a>
<!--Add a Sort/filter by: Date, CreatedBy, CreatedOn, Priority, don't forget ▼-->
    <h1>List Tickets</h1>
        <table>
            <tr>
                <th><a class="as-text" th:href="@{|/?sort=nameAsc|}">Name <span hidden="hidden">▲</span></a></th>
                <th><a class="as-text" th:href="@{|/?sort=descAsc|}">Description <span hidden="hidden">▲</span></a></th>
                <th><a class="as-text" th:href="@{|/?sort=priorityAsc|}">Priority <span hidden="hidden">▲</span></a></th>
                <th><a class="as-text">Actions</a></th>
            </tr>
            <tr th:each="ticket : ${tickets}">
                <td th:text="${ticket.name}"></td>
                <td th:text="${ticket.description}"></td>
                <td th:text="${ticket.priority}"></td>
                <td>
                    <a th:href="@{|/view/${ticket.id}|}">View</a>
                    <a th:href="@{|/edit/${ticket.id}|}">Edit</a>
                    <a th:href="@{|/delete/${ticket.id}|}">Delete</a>
                </td>
            </tr>
        </table>
    <a th:href="@{/add}">New</a>
    </body>
</html>
